syntax = "proto3";

package github.com.martketplace.vkr.crypto_wallet.pkg.api.grpc.v1.domain;

option go_package = "github.com/martketplace-vkr/crypto-wallet/pkg/api/grpc/v1/domain;domain";

import "google/protobuf/timestamp.proto";

message DepositAddress {
  int64 id = 1;
  int64 user_id = 2;
  string network = 3;
  string asset = 4;
  string address = 5;
  uint32 derivation_index = 6;
  string derivation_path = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}
